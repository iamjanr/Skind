name: Fake Jenkins

# Sandbox stand-in for the libpipelines "Jenkins" status check; set repo variable FAKE_JENKINS_FAIL=true to force red.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  Jenkins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Forced failure switch
        if: vars.FAKE_JENKINS_FAIL == 'true'
        run: |
          echo "FAKE_JENKINS_FAIL=true: failing on purpose"
          exit 1
